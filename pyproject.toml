[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aas-smt-lint"
# NOTE (mristin):
# Do not forget to sync with __init__.py!
version = "0.0.1"

description = "Assess automatically the quality of AAS Submodel Templates."
readme = "README.rst"
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

authors = [
    { name = "Marko Ristin", email = "rist@zhaw.ch" }
]

dependencies = [
    "icontract>=2,<3",
    "aas-core3.0",
    "inflect==7.5.0"
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "mypy==1.18.1",
    "pylint==3.3.8",
    "requests==2.32.4",
    "types-requests==2.32.4.20250913",
    "reuse==6.3.0"
]

impact_analysis = [
    "fsdag==1.0.1",
    "matplotlib==3.10.7"
]

[project.scripts]
aas-smt-lint = "aas_smt_lint.main:entry_point"

[project.urls]
repository = "https://github.com/mristin/aas-smt-lint"

[tool.setuptools.packages.find]
include = ["aas_smt_lint"]
exclude = ["continuous_integration", "tests", "impact_analysis", "dev_scripts"]

# Development tooling
[tool]
[tool.black]
line-length = 88

[tool.pylint]
disable = [
    "unnecessary-lambda", "no-else-raise", "too-few-public-methods", "no-else-return",
    "too-many-locals", "too-many-branches", "too-many-return-statements",
    "duplicate-code", "broad-exception-caught", "unnecessary-comprehension",
    "too-many-statements", "too-many-lines", "use-dict-literal", "invalid-name",
    "too-many-arguments", "too-many-positional-arguments",
    "too-many-instance-attributes", "unnecessary-negation",
    "too-many-nested-blocks", "no-else-continue"
]

[tool.mypy]
python_version = "3.10"
strict = true
